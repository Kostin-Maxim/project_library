<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Главная</title>
    <link href="{{ url_for('static', path='styles.css') }}?v=1" rel="stylesheet">
</head>

<body>
    <header>
        <h1>Проект "Библиотека": {% block name_content %}{% endblock%}</h1>
        <div class="user-container">
            <img src="{{ url_for('static', path='images/user-icon.png') }}" alt="Картинка пользователя">
            <p>Костин Максим</p>
        </div>
    </header>
    <div class="container">
        <nav>
            <a href="{{ url_for('gamespage') }}">
                <button class="nav-button">Игры</button>
            </a>
            <a href="{{ url_for('bookspage') }}">
                <button class="nav-button">Книги</button>
            </a>
        </nav>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>

</html>
